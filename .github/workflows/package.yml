name: Package source rehearsal
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/audit.py --history
      - run: python3 scripts/test_framework.py
      - run: python3 scripts/package_source.py --rehearsal --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framework-source-rehearsal
          path: dist/*
          if-no-files-found: error
      # No contents:write, release event, auto-publish, or updater manifest.
