name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: '3.13'
          - os: macos-15-intel
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python scripts/audit.py --history --report work/audit.json
      - run: python scripts/check.py --report work/checks.json
      - run: python scripts/test_framework.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-python-${{ matrix.python }}
          path: work/*.json
          if-no-files-found: error

  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r windows/requirements.txt
      - run: python -B windows/self_test.py
        # Native imports, pipes, ConPTY and owned Job cleanup with fake children.
        # This does not sign in to the official CLI or call a model.
      - name: Verify companion Skill installation in disposable Codex homes
        run: python -B -m unittest -v test_codex_skill.py
      - name: Build real per-user installer with bundled runtime
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing; no placeholder build allowed' }
          python -B scripts/build_windows_installer.py --out work/windows-release --iscc "$compiler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real install, upgrade, running guard and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem work/windows-release/*-setup.exe).FullName
          $baseline = Join-Path $PWD 'work/baseline-7-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/dneo9527-ctrl/agy-console/releases/download/v0.1.0-preview.7/AgyConsole-0.1.0-preview.7-windows-x64-setup.exe' -OutFile $baseline
          python -u -B windows/installer/test_installer.py --setup "$setup" --baseline-setup "$baseline" --baseline-sha256 '18cb90f132974077549395179fb608a49c143b73e312764796896d1da18e7278' --report work/windows-installer-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-installer-build-and-verification
          path: |
            work/windows-release/*
            work/windows-installer-verification.json
          if-no-files-found: error
