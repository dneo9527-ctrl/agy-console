name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            python: '3.13'
          - os: macos-15-intel
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python scripts/audit.py --history --report work/audit.json
      - run: python scripts/check.py --report work/checks.json
      - run: python scripts/test_framework.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-python-${{ matrix.python }}
          path: work/*.json
          if-no-files-found: error

  windows-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r windows/requirements.txt
      - run: python -B windows/self_test.py
        # Native imports, pipes, ConPTY and owned Job cleanup with fake children.
        # This does not sign in to the official CLI or call a model.
      - name: Verify companion Skill installation in disposable Codex homes
        run: python -B -m unittest -v test_codex_skill.py
      - name: Verify meetings, account sync, shared model policy and export against native Windows application
        env:
          # The shipped Start-Agy.cmd selects UTF-8 before invoking Python.
          PYTHONUTF8: '1'
        run: >-
          python -B -c "import sys, unittest;
          sys.path.insert(0, 'windows/app');
          suite = unittest.defaultTestLoader.loadTestsFromNames(['test_context_failure', 'test_meeting_context_anchors', 'test_roundtable_workspace', 'test_roundtable_workspace_bridge', 'test_roundtable_workspace_http', 'test_meeting_context', 'test_meeting_context_integration', 'test_meeting_context_bridge', 'test_roundtable_meetings', 'test_roundtable_meeting_bridge', 'test_roundtable_meeting_http', 'test_meeting_integration', 'test_roundtable_metrics_actions', 'test_account_sync', 'test_global_model_policy', 'test_transcript_export']);
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(not result.wasSuccessful())"
      - name: Verify stage-evidence UTF-16 prompt limit
        env:
          PYTHONUTF8: '1'
        run: python -B windows/test_meeting_context_limits.py
      - name: Build real per-user installer with bundled runtime
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing; no placeholder build allowed' }
          python -B scripts/build_windows_installer.py --out work/windows-release --iscc "$compiler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify public preview.24 complete upgrade and lifecycle
        shell: pwsh
        run: |
          $setup = (Get-ChildItem work/windows-release/*-setup.exe).FullName
          $baseline = Join-Path $PWD 'work/baseline-24-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/dneo9527-ctrl/agy-console/releases/download/v0.1.0-preview.24/AgyConsole-0.1.0-preview.24-windows-x64-setup.exe' -OutFile $baseline
          python -u -B windows/installer/test_installer.py --setup "$setup" --baseline-setup "$baseline" --baseline-version '0.1.0-preview.24' --baseline-sha256 'ffe37b5f11982e82c7b8731e50b0c3d1b11b8914d01b36aeb5da08ea9facf4ba' --report work/windows-installer-preview24-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify public preview.23 complete upgrade and lifecycle
        shell: pwsh
        run: |
          $setup = (Get-ChildItem work/windows-release/*-setup.exe).FullName
          $baseline = Join-Path $PWD 'work/baseline-23-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/dneo9527-ctrl/agy-console/releases/download/v0.1.0-preview.23/AgyConsole-0.1.0-preview.23-windows-x64-setup.exe' -OutFile $baseline
          python -u -B windows/installer/test_installer.py --setup "$setup" --baseline-setup "$baseline" --baseline-version '0.1.0-preview.23' --baseline-sha256 '37436c22fbf502c94c87bdff6031ee4c2618399d5bd30bec70c1ef5345fd252e' --report work/windows-installer-preview23-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify public preview.16 complete upgrade and lifecycle
        shell: pwsh
        run: |
          $setup = (Get-ChildItem work/windows-release/*-setup.exe).FullName
          $baseline = Join-Path $PWD 'work/baseline-16-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/dneo9527-ctrl/agy-console/releases/download/v0.1.0-preview.16/AgyConsole-0.1.0-preview.16-windows-x64-setup.exe' -OutFile $baseline
          python -u -B windows/installer/test_installer.py --setup "$setup" --baseline-setup "$baseline" --baseline-version '0.1.0-preview.16' --baseline-sha256 'e2f73ce9e1c31bf2462b2f09d7f60b661763814a4ee45e483aef238d1cd74a53' --report work/windows-installer-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify legacy preview.8 complete upgrade and lifecycle
        shell: pwsh
        run: |
          $setup = (Get-ChildItem work/windows-release/*-setup.exe).FullName
          $baseline = Join-Path $PWD 'work/baseline-8-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/dneo9527-ctrl/agy-console/releases/download/v0.1.0-preview.8/AgyConsole-0.1.0-preview.8-windows-x64-setup.exe' -OutFile $baseline
          python -u -B windows/installer/test_installer.py --setup "$setup" --baseline-setup "$baseline" --baseline-version '0.1.0-preview.8' --baseline-sha256 '75877212ada82bae876f0ed5a340f1e01909276db4d50648fe3ba39781592047' --report work/windows-installer-legacy8-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-installer-build-and-verification
          path: |
            work/windows-release/*
            work/windows-installer-verification.json
            work/windows-installer-preview23-verification.json
            work/windows-installer-preview24-verification.json
            work/windows-installer-legacy8-verification.json
          if-no-files-found: error
